
spring.application.name=EduNivel

# Puerto local o puerto asignado por el servidor
server.port=${PORT:8081}

# Base de datos: variables de entorno con valores locales de respaldo
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/edunivel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Plantillas
spring.thymeleaf.cache=true
