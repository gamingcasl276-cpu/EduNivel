spring.application.name=EduNivel
server.port=8081

# Configuración local de MySQL. Cambia estos valores según tu instalación.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edunivel?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Solo para desarrollo local: crea/actualiza tablas según las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
